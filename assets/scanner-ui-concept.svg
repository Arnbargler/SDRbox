 <rect x="784" y="328" width="138" height="62" rx="9" fill="url(#btn)" stroke="#6bef44" stroke-width="2"/><text x="853" y="361" fill="#f1fcf1">FIRE</text><text x="853" y="378" fill="#9cef78" font-size="11">ON</text>
</g>
<rect x="192" y="402" width="430" height="101" rx="9" fill="#090f18" stroke="#354958"/>
