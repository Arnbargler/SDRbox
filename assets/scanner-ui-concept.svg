<rect x="270" y="617" width="25" height="21" rx="3" fill="#090e13" stroke="#72889a"/><rect x="310" y="617" width="38" height="21" rx="3" fill="#090e13" stroke="#72889a"/>
<rect x="700" y="608" width="80" height="47" rx="7" fill="#cad5dd" stroke="#606f7a"/><text x="740" y="638" text-anchor="middle" font-size="18" font-family="Arial" font-weight="bold" fill="#1b2938">DELL</text>
<g fill="#c2cbd3" stroke="#121a20" stroke-width="2"><circle cx="142" cy="135" r="12"/><circle cx="980" cy="135" r="12"/><circle cx="142" cy="269" r="12"/><circle cx="980" cy="269" r="12"/><circle cx="142" cy="551" r="12"/><circle cx="980" cy="551" r="12"/><circle cx="142" cy="655" r="12"/><circle cx="980" cy="655" r="12"/></g>
<text x="560" y="694" text-anchor="middle" font-family="Arial" font-size="11" fill="#8192a3">SDRbox UI CONCEPT • illustrative only • not live radio data</text>
