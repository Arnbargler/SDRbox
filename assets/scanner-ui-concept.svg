<rect x="174" y="109" width="773" height="117" rx="14" fill="#080f19" stroke="#445464" stroke-width="4"/>
<text x="194" y="140" class="md">SDR SCANNER</text><text x="194" y="160" class="xs">Linux Mint</text>
