<rect x="174" y="250" width="773" height="315" rx="14" fill="#0c1621" stroke="#4a5b6b" stroke-width="4"/>
<text x="192" y="283" class="w">◉ SDR Scanner</text><text x="394" y="282" class="sm">Home Scan</text><text x="850" y="282" text-anchor="end" class="sm">Linux Mint</text>
<line x1="192" y1="295" x2="929" y2="295" stroke="#354957" />
<text x="192" y="316" class="xs">SCAN BANKS — TOUCH TO TOGGLE</text>
<g font-family="Arial" font-size="20" font-weight="bold" text-anchor="middle">
