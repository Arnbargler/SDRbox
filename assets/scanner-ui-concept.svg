<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="740" viewBox="0 0 1120 740" role="img" aria-label="SDRbox concept: slim 1U status monitor over 2U touchscreen with bank toggles above a Dell OptiPlex">
<style>
 .w{fill:#f1f7fb;font:700 20px Arial,sans-serif}.sm{fill:#a3b7c6;font:13px Arial,sans-serif}.xs{fill:#afc7d2;font:11px Arial,sans-serif}
 .md{fill:#ecf5fb;font:700 17px Arial,sans-serif}.big{fill:#edf6fb;font:700 37px 'DejaVu Sans Mono',monospace}
 .green{fill:#7eec4c}.g{fill:#88ff55}.dark{fill:#121b26}.outline{stroke:#375064;stroke-width:2}
</style>
<defs>
 <linearGradient id="rack" x2="0" y2="1"><stop stop-color="#202731"/><stop offset="1" stop-color="#0c1219"/></linearGradient>
 <linearGradient id="btn" x2="0" y2="1"><stop stop-color="#27532b"/><stop offset="1" stop-color="#12301e"/></linearGradient>
 <pattern id="grille" width="16" height="12" patternUnits="userSpaceOnUse"><path d="M0 0L16 12M16 0L0 12" stroke="#4d5963" stroke-width="2" opacity=".5"/></pattern>
</defs>
<rect width="1120" height="740" fill="#e3e5e6"/>
<rect x="110" y="32" width="900" height="680" rx="24" fill="url(#rack)" stroke="#050a10" stroke-width="6"/>
